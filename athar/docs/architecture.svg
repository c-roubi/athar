      <path d="M2 1L8 5L2 9" fill="none" stroke="#A9A89F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="760" height="600" fill="#F7F6F2"/>

  <text x="190" y="52" font-size="27" font-weight="700" letter-spacing="0.5" fill="#26251F">athar</text>
  <text x="192" y="73" font-size="11.5" letter-spacing="2.5" fill="#8B8A80" font-family="'DejaVu Sans Mono', Menlo, monospace">NETWORK FORENSIC ANALYSIS &#183; ARCHITECTURE</text>
  <line x1="190" y1="86" x2="570" y2="86" stroke="#DAD8D0" stroke-width="1"/>

